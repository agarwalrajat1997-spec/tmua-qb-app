name: ESAT recall upload stage v2

on:
  push:
    branches: [master]
    paths:
      - .github/esat-deploy-v2-trigger.txt

permissions:
  contents: write

jobs:
  build-and-trigger-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit a verified deployment marker
        run: |
          set -euo pipefail
          git config user.name "Thriving Scholars Release Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public/release-markers
          printf 'verified_build=%s\ncommit=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" > public/release-markers/esat-recall-upload-stage-v2.txt
          git add public/release-markers/esat-recall-upload-stage-v2.txt
          git commit -m "Verify ESAT recall upload stage build"
          git push origin master
