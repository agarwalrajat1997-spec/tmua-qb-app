name: One-shot fix TMUA overview test harness

on:
  push:
    paths:
      - ".github/workflows/one-shot-fix-tmua-overview-test.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix CSS module mock for visible loading state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-tmua-predictor-refresh.mjs")
          source = path.read_text(encoding="utf-8")
          old = '    if (id.endsWith(".module.css")) return {};'
          new = '    if (id.endsWith(".module.css")) return { default: new Proxy({}, { get: (_target, key) => String(key) }) };'
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit("CSS module mock anchor not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused TMUA regressions
        run: |
          npm run verify:tmua-predictor-overview
          npm run verify:tmua-dashboard-display-calibration

      - name: Commit verified fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-tmua-overview-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix TMUA overview regression harness"
          git push origin HEAD:main
