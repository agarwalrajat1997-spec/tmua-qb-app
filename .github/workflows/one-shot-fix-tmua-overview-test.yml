name: One-shot fix TMUA overview test harness

on:
  push:
    paths:
      - ".github/workflows/one-shot-fix-tmua-overview-test.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix regression harness for the browser fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-tmua-predictor-refresh.mjs")
          source = path.read_text(encoding="utf-8")

          css_old = '    if (id.endsWith(".module.css")) return {};'
          css_new = '    if (id.endsWith(".module.css")) return { default: new Proxy({}, { get: (_target, key) => String(key) }) };'
          if css_old in source:
              source = source.replace(css_old, css_new, 1)
          elif css_new not in source:
              raise SystemExit("CSS module mock anchor not found")

          settle_old = '  await h.respond(0);\n  assert.equal(win.listeners.size, 2);'
          settle_new = '  await h.respond(0); await h.tick(0);\n  assert.equal(win.listeners.size, 2);'
          if settle_old in source:
              source = source.replace(settle_old, settle_new, 1)
          elif settle_new not in source:
              raise SystemExit("actual hook settlement anchor not found")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused TMUA regressions
        run: |
          npm run verify:tmua-predictor-overview
          npm run verify:tmua-dashboard-display-calibration

      - name: Commit verified fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-tmua-overview-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix TMUA overview regression harness"
          git push origin HEAD:main
