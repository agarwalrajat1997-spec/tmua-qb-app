name: Diagnose TMUA overview build

on:
  push:
    branches:
      - debug/tmua-overview-build-20261112
    paths:
      - ".github/workflows/debug-tmua-overview-build.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TMUA overview controller regression
        run: npm run verify:tmua-predictor-overview && npm run verify:tmua-predictor-refresh && npm run verify:tmua-dashboard-display-calibration

      - name: Run production build
        run: npm run build
