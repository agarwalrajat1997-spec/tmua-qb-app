name: One-shot restore TMUA overview

on:
  push:
    paths:
      - ".github/workflows/one-shot-restore-tmua-overview.yml"
      - "scripts/one-shot-patch-tmua-overview.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded production overview patch
        run: python3 scripts/one-shot-patch-tmua-overview.py

      - name: Run focused structural checks
        run: |
          node scripts/verify-tmua-predictor-overview.mjs
          node scripts/verify-tmua-preparation-rank-overview.mjs
          node scripts/verify-tmua-dashboard-display-calibration.mjs

      - name: Commit production fix and remove one-shot files
        run: |
          rm .github/workflows/one-shot-restore-tmua-overview.yml
          rm scripts/one-shot-patch-tmua-overview.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore fast TMUA score and rank overview"
          git push origin HEAD:main
