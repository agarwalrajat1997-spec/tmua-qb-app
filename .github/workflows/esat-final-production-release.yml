name: ESAT final production release

on:
  push:
    branches: [master]
    paths:
      - .github/esat-final-production-release-trigger.txt

permissions:
  contents: write

concurrency:
  group: esat-recall-2024-25-final-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Download checksum-verified release bundle
        env:
          BUNDLE_URL: https://apps.thrivingscholars.com/api/internal/esat-release-bundle-v1
          BUNDLE_TOKEN: esat_bundle_v1_20260827_M8qR3nV7xK5pT2cF9hL4wY6sD1jB0aZu
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 8 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 180 \
            -H "Authorization: Bearer ${BUNDLE_TOKEN}" \
            "${BUNDLE_URL}" \
            -o /tmp/esat-final-release-bundle.tar.gz
          tar -xzf /tmp/esat-final-release-bundle.tar.gz

      - name: Validate bundle and remove temporary release infrastructure
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil

          manifest_path = Path('.release/manifest.json')
          if not manifest_path.exists():
              raise SystemExit('Release manifest is missing')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('release') != 'esat-recall-2024-25-six-tests' or manifest.get('version') != 1:
              raise SystemExit('Unexpected release manifest')

          for item in manifest.get('files', []):
              path = Path(item['path'])
              if not path.is_file():
                  raise SystemExit(f'Missing release file: {path}')
              payload = path.read_bytes()
              if len(payload) != item['bytes']:
                  raise SystemExit(f'Byte-count mismatch: {path}')
              if hashlib.sha256(payload).hexdigest() != item['sha256']:
                  raise SystemExit(f'Checksum mismatch: {path}')

          for route in manifest.get('required_routes', []):
              if not Path(route).is_file():
                  raise SystemExit(f'Missing protected route: {route}')

          for rel in manifest.get('deletions', []):
              path = Path(rel)
              if path.is_dir():
                  shutil.rmtree(path)
              elif path.exists() or path.is_symlink():
                  path.unlink()

          shutil.rmtree('tmp', ignore_errors=True)
          shutil.rmtree('.release', ignore_errors=True)

          slugs = [
              'engineering',
              'physics-chemistry',
              'physics-biology',
              'maths2-chemistry',
              'maths2-biology',
              'chemistry-biology',
          ]
          dashboard = Path('app/esat/ESATDashboardClient.tsx').read_text()
          helper = Path('lib/server/esat-recall-test.ts').read_text()
          for short in slugs:
              slug = f'esat-recall-2024-25-{short}'
              route = Path(f'app/esat-practice-tests/tests/{slug}/index.html/route.ts')
              public_copy = Path(f'public/esat-practice-tests/tests/{slug}/index.html')
              if slug not in dashboard:
                  raise SystemExit(f'Dashboard card missing: {slug}')
              if not route.is_file():
                  raise SystemExit(f'Protected route missing: {slug}')
              if public_copy.exists():
                  raise SystemExit(f'Public test copy must not exist: {slug}')
          for token in ['student_access', 'esat-practice-tests', 'esat-recall-tests', 'Response.redirect', 'private, no-store']:
              if token not in helper:
                  raise SystemExit(f'Protected helper token missing: {token}')
          if 'esat_release_v' in helper or 'esat_finalize_v1' in helper:
              raise SystemExit('Temporary release token leaked into final helper')
          PY

      - name: Run application verifiers
        run: |
          set -euo pipefail
          npm ci
          if [ -f scripts/verify-esat-practice-tests.mjs ]; then node scripts/verify-esat-practice-tests.mjs; fi
          if [ -f scripts/verify-esat-score-estimates.mjs ]; then node scripts/verify-esat-score-estimates.mjs; fi
          npm run build

      - name: Commit and push the verified release
        id: release_commit
        run: |
          set -euo pipefail
          git config user.name "Thriving Scholars Release Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release six protected ESAT 2024-25 recall mocks"
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          git push origin master

      - name: Verify production login protection and public PDFs
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          BASE='https://apps.thrivingscholars.com'
          shorts=(engineering physics-chemistry physics-biology maths2-chemistry maths2-biology chemistry-biology)
          ready=0
          for attempt in $(seq 1 150); do
            all_ok=1
            for short in "${shorts[@]}"; do
              slug="esat-recall-2024-25-${short}"
              headers="/tmp/${slug}.headers"
              code=$(curl -A 'Mozilla/5.0' -sS -o /dev/null -D "$headers" -w '%{http_code}' \
                "${BASE}/esat-practice-tests/tests/${slug}/index.html" || true)
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
              case "$code" in
                301|302|303|307|308) ;;
                *) all_ok=0 ;;
              esac
              if [[ "$location" != *"esat-login"* && "$location" != *"login"* ]]; then all_ok=0; fi
            done

            for short in "${shorts[@]}"; do
              pdf="${BASE}/esat-practice-tests/solutions/esat-2024-2025-recall-mock-${short}-solutions.pdf"
              body="/tmp/esat-${short}.pdf"
              headers="/tmp/esat-${short}.pdf.headers"
              code=$(curl -A 'Mozilla/5.0' -sS -o "$body" -D "$headers" -w '%{http_code}' "$pdf" || true)
              ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
              if [[ "$code" != '200' || "$ctype" != application/pdf* || "$(head -c 5 "$body")" != '%PDF-' ]]; then all_ok=0; fi
            done

            if [[ "$all_ok" == '1' ]]; then ready=1; break; fi
            sleep 6
          done
          if [[ "$ready" != '1' ]]; then
            echo 'Production verification did not pass before timeout' >&2
            exit 1
          fi

          mkdir -p release-reports
          python - <<PY
          from pathlib import Path
          import json
          base = 'https://apps.thrivingscholars.com'
          pathways = [
            ('Engineering','engineering',['Mathematics 1','Mathematics 2','Physics']),
            ('Physics + Chemistry','physics-chemistry',['Mathematics 1','Physics','Chemistry']),
            ('Physics + Biology','physics-biology',['Mathematics 1','Physics','Biology']),
            ('Maths 2 + Chemistry','maths2-chemistry',['Mathematics 1','Mathematics 2','Chemistry']),
            ('Maths 2 + Biology','maths2-biology',['Mathematics 1','Mathematics 2','Biology']),
            ('Chemistry + Biology','chemistry-biology',['Mathematics 1','Chemistry','Biology']),
          ]
          report = {
            'status':'complete',
            'release_commit':'${RELEASE_SHA}',
            'tests_login_protected':True,
            'solution_pdfs_public':True,
            'pathways':[
              {
                'pathway':label,
                'module_order':modules,
                'test_id':f'esat-2024-2025-recall-{short}',
                'slug':f'esat-recall-2024-25-{short}',
                'question_count':81,
                'test_url':f'{base}/esat-practice-tests/tests/esat-recall-2024-25-{short}/index.html',
                'pdf_url':f'{base}/esat-practice-tests/solutions/esat-2024-2025-recall-mock-{short}-solutions.pdf',
                'unauthenticated_test_redirect_verified':True,
                'public_pdf_verified':True,
              }
              for label,short,modules in pathways
            ],
          }
          Path('release-reports/esat-recall-2024-25-production.json').write_text(json.dumps(report,indent=2)+"\n")
          PY

      - name: Publish production verification report
        run: |
          set -euo pipefail
          git add release-reports/esat-recall-2024-25-production.json
          git commit -m "Record ESAT recall production verification"
          git push origin master
