name: ESAT recall PDF equivalence probe

on:
  push:
    branches:
      - agent/esat-recall-pdf-equivalence-20260826
    paths:
      - .github/workflows/esat-recall-pdf-equivalence.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect existing Level 2 solution PDFs
        shell: bash
        run: |
          set -euo pipefail
          source_dir="public/esat-practice-tests/solutions"
          out_dir="/tmp/esat-level2-pdfs"
          mkdir -p "$out_dir"
          files=(
            esat-chemistry-biology-level-2-solutions.pdf
            esat-maths2-biology-level-2-solutions.pdf
            esat-maths2-chemistry-level-2-solutions.pdf
            esat-physics-biology-level-2-solutions.pdf
            esat-physics-chemistry-level-2-solutions.pdf
          )
          for file in "${files[@]}"; do
            test -s "$source_dir/$file"
            cp "$source_dir/$file" "$out_dir/$file"
          done
          (cd "$out_dir" && sha256sum *.pdf > sha256.txt)
          ls -lh "$out_dir"

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: existing-esat-level2-solution-pdfs
          path: /tmp/esat-level2-pdfs
          if-no-files-found: error
          retention-days: 1
